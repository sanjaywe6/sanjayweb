<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ed">
  <meta name="description" content="My portfolio website is coming soon.">
  <title>Coming Soon | My Portfolio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #20231f;
      background: #f6f3ed;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(ellipse at 15% 15%, rgb(219 231 214 / 55%), transparent 38%),
        radial-gradient(ellipse at 90% 85%, rgb(238 220 195 / 55%), transparent 36%),
        #f6f3ed;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(36px, 8vw, 76px);
      border: 1px solid rgb(32 35 31 / 9%);
      border-radius: 24px;
      background: rgb(255 255 255 / 72%);
      box-shadow: 0 24px 70px rgb(52 48 39 / 8%);
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 24px;
      color: #61745a;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.06em;
      line-height: 1.05;
    }

    h1 span {
      color: #61745a;
    }

    .message {
      max-width: 420px;
      margin: 22px auto 0;
      color: #65675f;
      font-size: clamp(1rem, 2.8vw, 1.15rem);
      line-height: 1.7;
    }

    .divider {
      width: 44px;
      height: 2px;
      margin: 34px auto 0;
      border: 0;
      background: #b6c3ad;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A little something is in the works</p>
    <h1>Hi, <span>welcome</span></h1>
    <p class="message">Welcome to my portfolio. The website is coming soon.</p>
    <hr class="divider">
  </main>
</body>
</html>
